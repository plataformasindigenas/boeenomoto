# Index page
index_title: "Home"
index_hero_title: "Boe Eno Moto"
index_hero_tagline: "The Bororo World"
index_hero_subtitle: >-
  Dictionary, encyclopedia, fauna, and audio corpus of the Bororo people.
index_about_title: "About the Project"
index_about_p1: >-
  <strong>Boe eno moto</strong> ("Bororo world") is a platform dedicated to the preservation,
  documentation, and appreciation of the linguistic and cultural knowledge of the Bororo people.
index_about_p2: >-
  This repository brings together a variety of linguistic and ethnographic resources, both
  historical and contemporary, with the goal of supporting teaching, research, and
  revitalization efforts for the Bororo language. The platform offers a set of
  tools aimed at linguistic and anthropological study.

