name: Build Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check data (errors appear as annotations on the commit)
        run: terradoc check --format github
      - run: bash scripts/build.sh
      - name: Build must not modify the checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::the build changed tracked files"
            exit 1
          fi
