    function generateTOC(content, entryId) {
        var headingRegex = /<h([34])[^>]*>([^<]+)<\/h\1>/gi;
        var headings = [];
        var match;
        var index = 0;

        while ((match = headingRegex.exec(content)) !== null) {
            headings.push({ level: match[1], text: match[2].trim(), id: entryId + '-section-' + index });
            index++;
        }
        if (headings.length < 2) return { toc: '', content: content };

        var tocHtml = '<div class="toc"><div class="toc-title">' + T.enc_toc_title + '</div><ul class="toc-list">';
        for (var i = 0; i < headings.length; i++) {
            var h = headings[i];
            var className = h.level === '4' ? 'toc-h4' : '';
            tocHtml += '<li class="' + className + '"><a href="#' + h.id + '">' + (i + 1) + '. ' + escapeHtml(h.text) + '</a></li>';
        }
        tocHtml += '</ul></div>';

        index = 0;
        var modifiedContent = content.replace(headingRegex, function(match, level, text) {
            var id = entryId + '-section-' + index;
            index++;
            return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
        });
        return { toc: tocHtml, content: modifiedContent };
    }

    function renderInfobox(entry) {

        var hasUrl = entry.url;
        var hasVariants = entry.variants && entry.variants.length > 0;
        if (!hasImages && !hasKeywords && !hasUrl && !hasVariants) return '';

        var html = '<div class="infobox">';
        html += '<div class="infobox-header">' + escapeHtml(entry.headword) + '</div>';

        if (hasImages) {
            var img = entry.images.find(function(i) { return i.url; });
            if (img) {
                html += '<div class="infobox-image">';
                html += '<a href="' + escapeHtml(img.url) + '" target="_blank" rel="noopener">';
                html += '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(img.alt || entry.headword) + '" loading="lazy" onerror="this.parentElement.parentElement.style.display=\'none\'">';
                html += '</a>';
                if (img.credit) html += '<div class="infobox-image-credit">' + escapeHtml(img.credit) + '</div>';
                html += '</div>';
            }
        }
        if (hasVariants) {
            html += '<div class="infobox-row"><div class="infobox-label">' + T.enc_variants + '</div>';
            html += '<div class="infobox-value">' + entry.variants.map(function(v) { return '<em>' + escapeHtml(v) + '</em>'; }).join(', ') + '</div></div>';
        }
        if (hasKeywords) {
            html += '<div class="infobox-row"><div class="infobox-label">' + T.enc_categories + '</div>';
            html += '<div class="infobox-keywords">' + entry.keywords.map(function(kw) { return '<span class="infobox-keyword">' + escapeHtml(kw) + '</span>'; }).join('') + '</div></div>';
        }
        if (hasUrl) {
            html += '<div class="infobox-row infobox-link"><a href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener">' + T.enc_external_link + ' &rarr;</a></div>';
        }
        if (hasImages && entry.images.filter(function(i) { return i.url; }).length > 1) {
            html += '<div class="infobox-row"><div class="infobox-label">' + T.enc_more_images + '</div><div class="infobox-value">';
            entry.images.slice(1).forEach(function(img) {
                if (img.url) {
                    html += '<a href="' + escapeHtml(img.url) + '" target="_blank" rel="noopener" style="display:inline-block;margin:2px">';
                    html += '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(img.alt || '') + '" style="max-width:50px;max-height:40px;border-radius:2px" loading="lazy" onerror="this.parentElement.style.display=\'none\'">';
                    html += '</a>';
                }
            });
            html += '</div></div>';
        }
        html += '</div>';
        return html;
    }

    function renderExamples(examples) {
        if (!examples || examples.length === 0) return '';
        var html = '<div class="examples-section"><div class="examples-title">' + T.enc_examples + '</div>';
        examples.forEach(function(ex) {
            html += '<div class="example-block">';
            if (ex.bororo) html += '<div class="example-bororo">"' + escapeHtml(ex.bororo) + '"</div>';
            if (ex.translation) html += '<div class="example-translation">' + escapeHtml(ex.translation) + '</div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function hasKeyword(entry, keyword) {
        if (keyword === '__uncategorized__') return !entry.keywords || entry.keywords.length === 0;
        return entry.keywords && entry.keywords.includes(keyword);
    }

    function attachEntryListeners() {
        document.querySelectorAll('.entry').forEach(function(el) {
            var hasContent = el.querySelector('.entry-full-content');
            if (hasContent) {
                el.setAttribute('role', 'button');
                el.setAttribute('tabindex', '0');
                el.setAttribute('aria-expanded', 'false');
            }
            el.addEventListener('click', function(e) {
                if (e.target.tagName === 'A' || e.target.closest('a')) return;
                if (this.classList.contains('expanded') && e.target.closest('.entry-full-content') && !e.target.closest('.entry-collapse-hint')) return;
                this.classList.toggle('expanded');
                if (hasContent) this.setAttribute('aria-expanded', this.classList.contains('expanded'));
            });
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.classList.toggle('expanded');
                    if (hasContent) this.setAttribute('aria-expanded', this.classList.contains('expanded'));
                }
            });
        });
    }

    fetch('../encyclopedia-data.json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
            var keywords = {};
            json.data.forEach(function(item) {
                if (item.keywords) item.keywords.forEach(function(kw) { keywords[kw] = true; });
            });
            var kwFilter = document.getElementById('keyword-filter');
            Object.keys(keywords).sort().forEach(function(kw) {
                var opt = document.createElement('option');
                opt.value = kw;
                opt.textContent = kw;
                kwFilter.appendChild(opt);
            });

            document.getElementById('search-input').disabled = false;
            kwFilter.disabled = false;
            document.getElementById('results').innerHTML =
                '<div class="empty-state"><h2>' + T.enc_empty_title + '</h2><p>' + T.enc_empty_text + '</p></div>';

            initSearchPage({
                data: json.data,
                fuseKeys: [
                    { name: 'headword', weight: 2 },
                    { name: 'summary', weight: 1.5 },
                    { name: 'content_text', weight: 1 },
                    { name: 'keywords', weight: 1 },
                    { name: 'variants', weight: 0.5 }
                ],
                filterField: null,
                filterElementId: 'keyword-filter',
                filterFn: hasKeyword,
                renderEntry: function(entry, matchMap) {
                    var entryId = entry.id || Math.random().toString(36).substr(2, 9);
                    var hasContent = entry.content_html || (entry.examples && entry.examples.length > 0);
                    var html = '<div class="entry" data-entry-id="' + escapeHtml(entryId) + '">';

                    html += '<div class="entry-header">';
                    html += '<span class="entry-word">' + highlightMatches(entry.headword, matchMap['headword']) + '</span>';
                    if (hasContent) html += '<span class="entry-expand-icon">&#9660;</span>';
                    html += '</div>';

                    if (entry.summary) html += '<p class="entry-summary">' + highlightMatches(entry.summary, matchMap['summary']) + '</p>';

                    if (hasContent) {
                        html += '<div class="entry-full-content">';
                        html += renderInfobox(entry);
                        if (entry.content_html) {
                            var tocResult = generateTOC(entry.content_html, entryId);
                            html += '<div class="article-content">' + tocResult.toc + tocResult.content + '</div>';
                        }
                        html += renderExamples(entry.examples);
                        html += '<div style="clear:both"></div>';
                        html += '<div class="entry-collapse-hint">' + T.enc_collapse + '</div>';
                        html += '</div>';
                    } else {
                        var infobox = renderInfobox(entry);
                        if (infobox) {
                            html += '<div class="entry-full-content" style="display:block">' + infobox + '<div style="clear:both"></div></div>';
                        }
                    }
                    html += '</div>';
                    return html;
                },
                onResults: attachEntryListeners,
                labels: {
                    results: function(n) { return n !== 1 ? T.enc_result_plural : T.enc_result_singular; },
                    emptyTitle: T.enc_empty_title,
                    emptyText: T.enc_empty_text,
                    noResults: T.enc_no_results,
                    noResultsHint: T.enc_no_results_hint,
                    overflow: function(n) { return T.enc_overflow.replace('{n}', n); }
                }
            });
        });
    </script>
</body>
</html>
