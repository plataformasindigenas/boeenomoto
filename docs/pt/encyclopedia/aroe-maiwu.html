<head>
    <meta charset="UTF-8">

    <title>Aroe maiwu - Boe Eno Moto</title>

    <style>
        :root {
            --td-color-primary: #2D4A3E;
            --td-color-accent: #C2703E;
            --td-color-accent-muted: #A85D33;
            --td-color-bg: #F7F5F0;
            --td-color-bg-light: #EDE9E0;
            --td-color-bg-infobox: #FAF8F4;
            --td-color-border: #DDD8CE;
            --td-color-border-dark: #B8AFA2;
            --td-color-text: #2C2C2C;
            --td-color-text-muted: #6B6B6B;
            --td-color-highlight: #FFF9DB;
            --td-color-warning-bg: #FFF8E1;
            --td-color-surface: #FFFFFF;
            --td-color-border-light: #ECEAE5;
            --td-color-text-secondary: #555555;
            --td-color-accent-light: #FDF0EB;
            --td-color-success: #4A7C59;
            --td-color-error: #C44536;
            --td-color-accent-ring: rgba(194, 112, 62, 0.2);
            --td-radius: 8px;
            --td-font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --td-font-headings: 'Bitter', 'Georgia', 'Cambria', serif;
            --td-font-mono: 'Lucida Sans Unicode', 'DejaVu Sans', monospace;
            --td-term-color: #A85D33;
            --td-term-weight: 600;
        }
.breadcrumb {
    font-size: 0.9rem;
    color: var(--td-color-text-muted);
    margin-bottom: 1rem;
}
.breadcrumb a {
    color: var(--td-color-accent);
    text-decoration: none;
}
.breadcrumb a:hover {
    text-decoration: underline;
}
.breadcrumb-sep {
    margin: 0 0.4rem;
}
article header {
    text-align: left;
    border-bottom: 2px solid var(--td-color-border);
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
}
article header h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem 0;
}
.article-abstract {
    color: var(--td-color-text-secondary);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0.5rem 0;
}
.article-variants {
    font-size: 0.9rem;
    color: var(--td-color-text-secondary);
    margin-bottom: 0.5rem;
}
.variant-tag {
    background: var(--td-color-border);
    padding: 0.1rem 0.5rem;
    border-radius: var(--td-radius);
    margin-right: 0.3rem;
    font-style: italic;
}
.infobox {
    float: right;
    clear: right;
    width: 280px;
    margin: 0 0 1.25rem 1.5rem;
    padding: 0;
    border: 1px solid var(--td-color-border-dark);
    background: linear-gradient(to bottom, var(--td-color-bg-infobox), var(--td-color-surface));
    font-size: 0.88rem;
    border-radius: var(--td-radius);
    overflow: hidden;
}
.infobox-header {
    background: var(--td-color-accent-light);
    padding: 0.7rem 0.85rem;
    font-weight: 600;
    color: var(--td-color-primary);
    text-align: center;
    border-bottom: 1px solid var(--td-color-border-dark);
}
.infobox-image {
    text-align: center;
    padding: 0.85rem;
    background: var(--td-color-surface);
    border-bottom: 1px solid var(--td-color-border-dark);
}
.infobox-image img {
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
    border-radius: var(--td-radius);
}
.infobox-image-credit {
    font-size: 0.75rem;
    color: var(--td-color-text-muted);
    margin-top: 0.35rem;
}
.infobox-row {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--td-color-border);
}
.infobox-row:last-child {
    border-bottom: none;
}
.infobox-label {
    font-weight: 500;
    color: var(--td-color-text-secondary);
    font-size: 0.8rem;
    margin-bottom: 0.2rem;
}
.infobox-value {
    color: var(--td-color-text);
}
.infobox-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}
.infobox-keyword {
    font-size: 0.75rem;
    background: var(--td-color-border);
    color: var(--td-color-text-secondary);
    padding: 0.15rem 0.4rem;
    border-radius: var(--td-radius);
}
.infobox-keyword a {
    color: var(--td-color-text-secondary);
    text-decoration: none;
}
.infobox-keyword a:hover {
    text-decoration: underline;
}
.infobox-link a {
    color: var(--td-color-accent);
    text-decoration: none;
    font-size: 0.85rem;
}
.infobox-link a:hover {
    text-decoration: underline;
}
.infobox-thumb {
    display: inline-block;
    margin: 2px;
}
.infobox-thumb img {
    max-width: 50px;
    max-height: 40px;
    border-radius: 2px;
    object-fit: cover;
}
.toc {
    display: inline-block;
    background: var(--td-color-bg-infobox);
    border: 1px solid var(--td-color-border-dark);
    padding: 0.75rem 1.25rem;
    margin: 0.5rem 0 1rem 0;
    font-size: 0.9rem;
    max-width: 100%;
}
.toc-title {
    font-weight: 600;
    color: var(--td-color-primary);
    margin-bottom: 0.5rem;
    text-align: center;
}
.toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
.toc-list li {
    padding: 0.2rem 0;
}
.toc-list a {
    color: var(--td-color-accent);
    text-decoration: none;
}
.toc-list a:hover {
    text-decoration: underline;
}
.toc-h4 {
    padding-left: 1rem;
    font-size: 0.85rem;
}
.article-content {
    line-height: 1.7;
    color: var(--td-color-text);
}
.article-content::after {
    content: "";
    display: table;
    clear: both;
}
.article-content h3 {
    font-size: 1.3rem;
    color: var(--td-color-primary);
    margin: 2rem 0 0.75rem 0;
    padding-left: 0.75rem;
    border-left: 3px solid var(--td-color-accent);
    font-weight: 600;
    line-height: 1.3;
}
.article-content h3:first-child {
    margin-top: 0;
}
.article-content > p:first-of-type {
    font-size: 1.08rem;
    line-height: 1.8;
}
.article-content > p:first-of-type::first-letter {
    float: left;
    font-size: 2.8rem;
    line-height: 1;
    font-weight: 700;
    color: var(--td-color-accent);
    margin-right: 0.15rem;
    margin-top: 0.05rem;
}
.article-content h4 {
    font-size: 1.1rem;
    color: var(--td-color-primary);
    margin: 1.25rem 0 0.5rem 0;
    font-weight: 600;
}
.article-content p {
    margin: 0.75rem 0;
    text-align: justify;
}
.article-content ul, .article-content ol {
    margin: 0.75rem 0;
    padding-left: 1.5rem;
}
.article-content li {
    margin: 0.35rem 0;
}
.article-content em {
    font-style: italic;
}
.article-content strong {
    font-weight: 600;
    color: var(--td-color-primary);
}
.article-content hr {
    border: none;
    border-top: 1px solid var(--td-color-border);
    margin: 1.25rem 0;
}
.broken-link {
    color: var(--td-color-error);
    text-decoration: underline wavy;
}
.examples-section {
    margin-top: 2rem;
}
.examples-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--td-color-primary);
    margin-bottom: 0.75rem;
}
.example-block {
    background: linear-gradient(to right, var(--td-color-bg-light), var(--td-color-bg-infobox));
    border-left: 4px solid var(--td-color-accent);
    padding: 0.9rem 1rem;
    margin: 0.6rem 0;
    border-radius: 0 var(--td-radius) var(--td-radius) 0;
}
.example-bororo {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--td-color-primary);
    margin-bottom: 0.4rem;
    font-style: italic;
}
.example-translation {
    font-size: 0.92rem;
    color: var(--td-color-text-secondary);
    padding-left: 0.5rem;
    border-left: 2px solid var(--td-color-border-dark);
    margin-left: 0.25rem;
}
.references-section {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--td-color-border);
}
.references-section h2 {
    font-size: 1.2rem;
    color: var(--td-color-primary);
    margin-bottom: 0.75rem;
}
.references-section ol {
    padding-left: 1.5rem;
}
.references-section li {
    margin: 0.5rem 0;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--td-color-text-secondary);
}
.ref-error {
    color: var(--td-color-error);
}
.see-also-section {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--td-color-border);
}
.see-also-section h2 {
    font-size: 1.2rem;
    color: var(--td-color-primary);
    margin-bottom: 0.75rem;
}
.see-also-section ul {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.see-also-section li a {
    display: inline-block;
    background: var(--td-color-bg-light);
    color: var(--td-color-accent-muted);
    padding: 0.3rem 0.75rem;
    border-radius: var(--td-radius);
    text-decoration: none;
    font-size: 0.9rem;
}
.see-also-section li a:hover {
    background: var(--td-color-accent-light);
    text-decoration: underline;
}
.cross-links-section {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--td-color-border);
}
.cross-links-section h2 {
    font-size: 1.2rem;
    color: var(--td-color-primary);
    margin-bottom: 0.75rem;
}
.cross-links-section a {
    color: var(--td-color-accent);
    text-decoration: none;
    margin-right: 1rem;
}
.cross-links-section a:hover {
    text-decoration: underline;
}
.article-footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--td-color-border);
    font-size: 0.85rem;
    color: var(--td-color-text-muted);
}
.article-footer .category-breadcrumbs {
    margin-top: 0.5rem;
}
.article-footer .category-breadcrumbs a {
    color: var(--td-color-accent);
    text-decoration: none;
}
.article-footer .category-breadcrumbs a:hover {
    text-decoration: underline;
}
.back-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: var(--td-color-accent);
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover {
    text-decoration: underline;
}
@media (max-width: 700px) {
    .infobox {
        float: none;
        width: 100%;
        margin: 0 0 1rem 0;
    }
    article header h1 {
        font-size: 1.5rem;
    }
    .article-content h3 {
        font-size: 1.15rem;
    }
    .article-content h4 {
        font-size: 1rem;
    }
    .article-content p {
        text-align: left;
    }
}
    </style>
