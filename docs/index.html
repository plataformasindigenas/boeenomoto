<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boe Eno Moto</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/fonts.css">
    <style>
        :root {
            --td-color-primary: #2D4A3E;
            --td-color-accent: #C2703E;
            --td-color-bg: #F7F5F0;
            --td-color-text: #2C2C2C;
            --td-color-text-secondary: #555555;
            --td-color-surface: #FFFFFF;
            --td-color-border: #DDD8CE;
            --td-radius: 8px;
            --td-font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --td-font-headings: 'Bitter', 'Georgia', 'Cambria', serif;
            --td-term-color: #A85D33;
            --td-term-weight: 600;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--td-font-family);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background: var(--td-color-bg);
            color: var(--td-color-text);
            text-align: center;
        }
        h1 { color: var(--td-color-primary); font-size: 2.5rem; margin-bottom: 0.5rem; font-family: var(--td-font-headings); }
        .subtitle { color: var(--td-color-text-secondary); font-size: 1.2rem; margin-bottom: 2rem; }
        .logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 1rem auto;
            display: block;
            object-fit: contain;
        }
        .languages {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lang-card {
            display: block;
            background: var(--td-color-surface);
            border: 1px solid var(--td-color-border);
            border-radius: var(--td-radius);
            padding: 2rem 3rem;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
            min-width: 200px;
        }
        .lang-card:hover { border-color: var(--td-color-accent); }
        .lang-card h2 { margin: 0 0 0.25rem 0; color: var(--td-color-primary); font-family: var(--td-font-headings); }
    </style>
</head>
<body class="td-style-terra">
    <img src="images/logo.png" alt="" class="logo">
    <h1>Boe Eno Moto</h1>
    <p class="subtitle">Mundo Bororo</p>
    <div class="languages">
        <a href="pt/index.html" class="lang-card">
            <h2>Português</h2>
        </a>
        <a href="en/index.html" class="lang-card">
            <h2>English</h2>
        </a>
    </div>
</body>
</html>
