<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopédia Bororo - Boe Eno Moto</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;

            background: #F9F6F2;

        nav {

            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

            text-decoration: none;

        }
        .subtitle {

            font-size: 0.95rem;
        }

        .search-row {

            flex-wrap: wrap;
        }

        .filter-select {

            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .stats {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #666;
        }
        .results-container {
            background: white;
            border-radius: 4px;
            border: 1px solid #E8E4DF;

        }
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #888;
        }
        .empty-state h2 {
            margin: 0 0 0.5rem 0;
            color: #666;
        }
        .entry {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        }
        .entry:hover {

        }

            background: #fff8e1;

            font-size: 0.9rem;
            color: #666;

            gap: 1rem;
            margin-top: 0.75rem;
            align-items: flex-start;

        .entry-thumbnail {
            max-width: 120px;
            max-height: 90px;
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;

        .entry-links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;

            color: #C75B39;
            text-decoration: none;
        }

            text-decoration: underline;

        .highlight {
            background: #fff59d;
            padding: 0 2px;
            border-radius: 2px;
        }
        footer {
            margin-top: 2rem;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #e0e0e0;
        }
        footer a {
            color: #C75B39;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .search-row {
                flex-direction: column;
            }
            .search-input, .filter-select {
                width: 100%;
            }
            .entry-thumbnail {
                max-width: 80px;
            }
            nav {
                justify-content: center;
            }
        }
/* Entry card - collapsed state */
.entry {
    cursor: pointer;
    transition: background 0.2s;
}
.entry.expanded {
    cursor: default;
    background: white;
}
.entry-collapse-hint {
    display: none;
    font-size: 0.8rem;
    color: #888;
    margin-top: 0.5rem;
    text-align: center;
}
.entry.expanded .entry-collapse-hint {
    display: block;
}

/* Entry header with expand indicator */
.entry-header {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
}
.entry-expand-icon {
    font-size: 0.8rem;
    color: #888;
    transition: transform 0.2s;
    margin-left: auto;
}
.entry.expanded .entry-expand-icon {
    transform: rotate(180deg);
}

/* Summary styling */
.entry-summary {
    color: #555;
    font-size: 0.95rem;
    margin: 0;
    line-height: 1.5;
}

/* Expandable content area */
.entry-full-content {
    display: none;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid #eee;
}
.entry.expanded .entry-full-content {
    display: block;
}

/* Wikipedia-style infobox */
.infobox {
    float: right;
    clear: right;
    width: 260px;
    margin: 0 0 1rem 1.5rem;
    padding: 0;
    border: 1px solid #C8B8A8;
    background: #FAF8F5;
    font-size: 0.88rem;
    border-collapse: collapse;
}
.infobox-header {
    background: #E8DFD5;
    padding: 0.6rem 0.75rem;
    font-weight: 600;
    color: #3D352F;
    text-align: center;
    border-bottom: 1px solid #C8B8A8;
}
.infobox-image {
    text-align: center;
    padding: 0.75rem;
    background: white;
    border-bottom: 1px solid #C8B8A8;
}
.infobox-image img {
    max-width: 100%;

    object-fit: contain;
    border-radius: 2px;
}
.infobox-image-credit {

.infobox-row {

.infobox-value {

}
.infobox-keywords {

    flex-wrap: wrap;
    gap: 0.25rem;

    background: #E8E4DF;

    padding: 0.15rem 0.4rem;

.infobox-link a {

.infobox-link a:hover {
    text-decoration: underline;
}

}
.toc-title {
    font-weight: 600;

    margin-bottom: 0.5rem;
    text-align: center;
}
.toc-list {
    list-style: none;

}
.toc-list a {
    color: #C75B39;
    text-decoration: none;

.toc-list a:hover {
    text-decoration: underline;
}

}

/* Article content typography */
.article-content {
    line-height: 1.7;
    color: #333;
}

    margin: 0.75rem 0;

}
.article-content ul, .article-content ol {

    padding-left: 1.5rem;
}

    margin: 0.35rem 0;
}

}

    border: none;

}

/* Example quote blocks */
.examples-section {
    margin-top: 1.25rem;
}
.examples-title {
    font-size: 1rem;
    font-weight: 600;
    color: #3D352F;
    margin-bottom: 0.75rem;
}
.example-block {
    background: linear-gradient(to right, #F5F0EB, #FAF8F5);
    border-left: 4px solid #C75B39;
    padding: 0.9rem 1rem;
    margin: 0.6rem 0;
    border-radius: 0 4px 4px 0;
}
.example-bororo {
    font-size: 1.05rem;
    font-weight: 500;
    color: #3D352F;
    margin-bottom: 0.4rem;
    font-style: italic;
}
.example-translation {
    font-size: 0.92rem;
    color: #666;
    padding-left: 0.5rem;
    border-left: 2px solid #DDD;
    margin-left: 0.25rem;
}

/* Variants display */
.entry-variants {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 0.5rem;
}
.variant-tag {
    background: #E8E4DF;
    padding: 0.1rem 0.5rem;
    border-radius: 3px;
    margin-right: 0.3rem;
    font-style: italic;
}

/* Loading state */
.loading-state {

    color: #888;
}

/* Responsive adjustments */
@media (max-width: 700px) {
    .infobox {
        float: none;
        width: 100%;
        margin: 0 0 1rem 0;
    }

    }
    .article-content h4 {
        font-size: 1rem;

    }

<body>
    <nav>
        <a href="index.html" class="brand">Boe Eno Moto</a>
        <a href="dictionary.html">Dicionário</a>
        <a href="encyclopedia.html" class="active">Enciclopédia</a>
        <a href="fauna.html">Fauna</a>
        <a href="bibliography.html">Bibliografia</a>
    </nav>

    <header>
        <h1>Enciclopédia Bororo</h1>
        <p class="subtitle">Bororo Encyclopedia Entries &mdash; 168 verbetes</p>
    </header>

    <div class="search-container">
        <div class="search-row">
            <input type="text" id="search-input" class="search-input" placeholder="Pesquisar na enciclopédia..." autocomplete="off" disabled>
            <select id="keyword-filter" class="filter-select" disabled>
                <option value="">Todas as categorias</option>
                <option value="__uncategorized__">Sem categoria</option>
            </select>
        </div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="results-container" id="results">
        <div class="loading-state" id="loading">
            Carregando enciclopédia...
        </div>
    </div>

    <footer>
        <p>Gerado com <a href="https://github.com/plataformasindigenas/aptoro">aptoro</a> e <a href="https://github.com/plataformasindigenas/kodudo">kodudo</a></p>
<p>Schema v1.0</p>    </footer>

    <script src="js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

    <script>
    function generateTOC(content, entryId) {
        var headingRegex = /<h([34])[^>]*>([^<]+)<\/h\1>/gi;
        var headings = [];
        var match;
        var index = 0;

        while ((match = headingRegex.exec(content)) !== null) {
            headings.push({
                level: match[1],
                text: match[2].trim(),
                id: entryId + '-section-' + index
            });
            index++;
        }

        if (headings.length < 2) return { toc: '', content: content };

        var tocHtml = '<div class="toc"><div class="toc-title">Conteúdo</div><ul class="toc-list">';
        for (var i = 0; i < headings.length; i++) {
            var h = headings[i];
            var className = h.level === '4' ? 'toc-h4' : '';
            tocHtml += '<li class="' + className + '"><a href="#' + h.id + '">' + (i + 1) + '. ' + escapeHtml(h.text) + '</a></li>';
        }
        tocHtml += '</ul></div>';

        index = 0;
        var modifiedContent = content.replace(headingRegex, function(match, level, text) {
            var id = entryId + '-section-' + index;
            index++;
            return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
        });

        return { toc: tocHtml, content: modifiedContent };
    }

    function renderInfobox(entry) {
        var hasImages = entry.images && entry.images.length > 0 && entry.images.some(function(img) { return img.url; });
        var hasKeywords = entry.keywords && entry.keywords.length > 0;
        var hasUrl = entry.url;
        var hasVariants = entry.variants && entry.variants.length > 0;

        if (!hasImages && !hasKeywords && !hasUrl && !hasVariants) return '';

        var html = '<div class="infobox">';
        html += '<div class="infobox-header">' + escapeHtml(entry.headword) + '</div>';

        if (hasImages) {
            var img = entry.images.find(function(i) { return i.url; });
            if (img) {
                html += '<div class="infobox-image">';
                html += '<a href="' + escapeHtml(img.url) + '" target="_blank" rel="noopener">';
                html += '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(img.alt || entry.headword) + '" loading="lazy" onerror="this.parentElement.parentElement.style.display=\'none\'">';
                html += '</a>';
                if (img.credit) {
                    html += '<div class="infobox-image-credit">' + escapeHtml(img.credit) + '</div>';
                }
                html += '</div>';
            }
        }

        if (hasVariants) {
            html += '<div class="infobox-row">';
            html += '<div class="infobox-label">Variantes</div>';
            html += '<div class="infobox-value">' + entry.variants.map(function(v) { return '<em>' + escapeHtml(v) + '</em>'; }).join(', ') + '</div>';
            html += '</div>';
        }

        if (hasKeywords) {
            html += '<div class="infobox-row">';
            html += '<div class="infobox-label">Categorias</div>';
            html += '<div class="infobox-keywords">';
            html += entry.keywords.map(function(kw) { return '<span class="infobox-keyword">' + escapeHtml(kw) + '</span>'; }).join('');
            html += '</div></div>';
        }

        if (hasUrl) {
            html += '<div class="infobox-row infobox-link">';
            html += '<a href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener">Ver referência externa &rarr;</a>';
            html += '</div>';
        }

        if (hasImages && entry.images.filter(function(i) { return i.url; }).length > 1) {
            html += '<div class="infobox-row">';
            html += '<div class="infobox-label">Mais imagens</div>';
            html += '<div class="infobox-value">';
            entry.images.slice(1).forEach(function(img) {
                if (img.url) {
                    html += '<a href="' + escapeHtml(img.url) + '" target="_blank" rel="noopener" style="display:inline-block;margin:2px">';
                    html += '<img src="' + escapeHtml(img.url) + '" alt="' + escapeHtml(img.alt || '') + '" style="max-width:50px;max-height:40px;border-radius:2px" loading="lazy" onerror="this.parentElement.style.display=\'none\'">';
                    html += '</a>';
                }
            });
            html += '</div></div>';
        }

        html += '</div>';
        return html;
    }

    function renderExamples(examples) {
        if (!examples || examples.length === 0) return '';

        var html = '<div class="examples-section">';
        html += '<div class="examples-title">Exemplos</div>';

        examples.forEach(function(ex) {
            html += '<div class="example-block">';
            if (ex.bororo) {
                html += '<div class="example-bororo">"' + escapeHtml(ex.bororo) + '"</div>';
            }
            if (ex.translation) {
                html += '<div class="example-translation">' + escapeHtml(ex.translation) + '</div>';
            }
            html += '</div>';
        });

        html += '</div>';
        return html;
    }

    function hasKeyword(entry, keyword) {
        if (keyword === '__uncategorized__') {
            return !entry.keywords || entry.keywords.length === 0;
        }
        return entry.keywords && entry.keywords.includes(keyword);
    }

    function attachEntryListeners() {
        document.querySelectorAll('.entry').forEach(function(entry) {
            entry.addEventListener('click', function(e) {
                if (e.target.tagName === 'A' || e.target.closest('a')) return;
                if (this.classList.contains('expanded') &&
                    e.target.closest('.entry-full-content') &&
                    !e.target.closest('.entry-collapse-hint')) {
                    return;
                }
                this.classList.toggle('expanded');
            });
        });
    }

    fetch('encyclopedia-data.json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
            // Populate keyword filter from data
            var keywords = {};
            json.data.forEach(function(item) {
                if (item.keywords) {
                    item.keywords.forEach(function(kw) { keywords[kw] = true; });
                }
            });
            var kwFilter = document.getElementById('keyword-filter');
            Object.keys(keywords).sort().forEach(function(kw) {
                var opt = document.createElement('option');
                opt.value = kw;
                opt.textContent = kw;
                kwFilter.appendChild(opt);
            });

            // Enable inputs
            document.getElementById('search-input').disabled = false;
            kwFilter.disabled = false;

            // Show empty state
            document.getElementById('results').innerHTML =
                '<div class="empty-state">' +
                '<h2>Pesquise na enciclopédia</h2>' +
                '<p>Digite um termo para começar</p>' +
                '</div>';

            initSearchPage({
                data: json.data,
                fuseKeys: [
                    { name: 'headword', weight: 2 },
                    { name: 'summary', weight: 1.5 },
                    { name: 'content_text', weight: 1 },
                    { name: 'keywords', weight: 1 },
                    { name: 'variants', weight: 0.5 }
                ],
                filterField: null,
                filterElementId: 'keyword-filter',
                filterFn: hasKeyword,
                renderEntry: function(entry, matchMap) {
                    var entryId = entry.id || Math.random().toString(36).substr(2, 9);
                    var hasContent = entry.content_html || (entry.examples && entry.examples.length > 0);

                    var html = '<div class="entry" data-entry-id="' + escapeHtml(entryId) + '">';

                    html += '<div class="entry-header">';
                    html += '<span class="entry-word">' + highlightMatches(entry.headword, matchMap['headword']) + '</span>';
                    if (hasContent) {
                        html += '<span class="entry-expand-icon">&#9660;</span>';
                    }
                    html += '</div>';

                    if (entry.summary) {
                        html += '<p class="entry-summary">' + highlightMatches(entry.summary, matchMap['summary']) + '</p>';
                    }

                    if (hasContent) {
                        html += '<div class="entry-full-content">';
                        html += renderInfobox(entry);

                        if (entry.content_html) {
                            var tocResult = generateTOC(entry.content_html, entryId);
                            html += '<div class="article-content">';
                            html += tocResult.toc;
                            html += tocResult.content;
                            html += '</div>';
                        }

                        html += renderExamples(entry.examples);
                        html += '<div style="clear:both"></div>';
                        html += '<div class="entry-collapse-hint">Clique para recolher</div>';
                        html += '</div>';
                    } else {
                        var infobox = renderInfobox(entry);
                        if (infobox) {
                            html += '<div class="entry-full-content" style="display:block">';
                            html += infobox;
                            html += '<div style="clear:both"></div>';
                            html += '</div>';
                        }
                    }

                    html += '</div>';
                    return html;
                },
                onResults: attachEntryListeners,
                labels: {
                    results: function(n) { return 'verbete' + (n !== 1 ? 's' : '') + ' encontrado' + (n !== 1 ? 's' : ''); },
                    emptyTitle: 'Pesquise na enciclopédia',
                    emptyText: 'Digite um termo para começar',
                    noResults: 'Nenhum resultado',
                    noResultsHint: 'Tente um termo diferente ou altere o filtro',
                    overflow: function(n) { return 'Mostrando 100 de ' + n + ' resultados. Refine sua busca.'; }
                }
            });
        });
    </script>
