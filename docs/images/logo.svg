<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="top"><rect x="0" y="0" width="100" height="50"/></clipPath>
    <clipPath id="bot"><rect x="0" y="50" width="100" height="50"/></clipPath>
  </defs>

  <!-- Top semicircle — Tugarege (red) -->
  <circle cx="50" cy="50" r="48" fill="#C81F2D" clip-path="url(#top)"/>

  <!-- Bottom semicircle — Ecerae (dark) -->
  <circle cx="50" cy="50" r="48" fill="#111827" clip-path="url(#bot)"/>

  <!-- Dividing line (east-west axis) -->
  <line x1="2" y1="50" x2="98" y2="50" stroke="#F4F1EA" stroke-width="2" opacity="0.6"/>

  <!-- Baito (men's house) — gold centre -->
  <circle cx="50" cy="50" r="14" fill="#D4A03A"/>
</svg>
