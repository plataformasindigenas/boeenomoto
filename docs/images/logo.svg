<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clip for top half (Tugarege) -->
    <clipPath id="top-half">
      <rect x="0" y="0" width="512" height="256"/>
    </clipPath>
    <!-- Clip for bottom half (Ecerae) -->
    <clipPath id="bottom-half">
      <rect x="0" y="256" width="512" height="256"/>
    </clipPath>
    <!-- Main circle clip -->
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>
  </defs>

  <!-- Outer ring (thin border) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#111827" stroke-width="6"/>

  <!-- Top semicircle — Tugarege (red) -->
  <circle cx="256" cy="256" r="220" fill="#C81F2D" clip-path="url(#top-half)"/>

  <!-- Bottom semicircle — Ecerae (dark ink) -->
  <circle cx="256" cy="256" r="220" fill="#111827" clip-path="url(#bottom-half)"/>

  <!-- Dividing line (east-west axis) -->
  <line x1="36" y1="256" x2="476" y2="256" stroke="#F4F1EA" stroke-width="3" opacity="0.5"/>

  <!-- Houses around the village circle (small dots on the ring) -->
  <!-- 12 houses evenly spaced, slightly inset from the edge -->
  <g fill="#F4F1EA" opacity="0.85">
    <!-- 12 houses on ring r=198 (outer edge aligns with main circle r=220) -->
    <circle cx="256" cy="58" r="22"/>
    <circle cx="355" cy="85" r="22"/>
    <circle cx="428" cy="157" r="22"/>
    <circle cx="454" cy="256" r="22"/>
    <circle cx="428" cy="355" r="22"/>
    <circle cx="355" cy="427" r="22"/>
    <circle cx="256" cy="454" r="22"/>
    <circle cx="157" cy="427" r="22"/>
    <circle cx="84" cy="355" r="22"/>
    <circle cx="58" cy="256" r="22"/>
    <circle cx="84" cy="157" r="22"/>
    <circle cx="157" cy="85" r="22"/>
  </g>

  <!-- Inner ring around baito -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#F4F1EA" stroke-width="5" opacity="0.6"/>

  <!-- Baito (men's house) — central circle -->
  <circle cx="256" cy="256" r="58" fill="#D4A03A"/>

  <!-- Small inner dot in baito -->
  <circle cx="256" cy="256" r="24" fill="#111827"/>
</svg>
