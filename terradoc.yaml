project_name: "Boe Eno Moto"
project_subtitle: "Mundo Bororo"
site_title: "Boe Eno Moto"
site_tagline: "Mundo Bororo"
culture_name: "Bororo"
meta_prefix: "bororo"
locales: ["pt", "en"]
locale_labels:
  pt: "Português"
  en: "English"
default_locale: "pt"
base_url: "https://boeenomoto.terradoc.org"
featured_article_id: "boe"
bib_file: "bororo.bib"

modules:
  dictionary: { enabled: true }
  fauna: { enabled: true }
  ethnobotany: { enabled: true }
  encyclopedia: { enabled: true }
  bibliography: { enabled: true }
  recordings: { enabled: false }
  corpus: { enabled: false }  # no corpus data yet; enable with config/corpus.yaml
  videos: { enabled: true }

module_labels:
  dictionary: "Dicionário"
  encyclopedia: "Enciclopédia"
  fauna: "Fauna"
  ethnobotany: "Etnobotânica"
  bibliography: "Bibliografia"
  recordings: "Corpus"
  videos: "Vídeos"

# Código ISO 639-3 da língua (atributo lang no texto na língua).
language_code: bor

# Teclas extras do teclado do dicionário (versão 2): as vogais acentuadas da escrita.
keyboard: [á, é, í, ó, ú]

theme:
  # Versão 2 dos modelos (precisa do terradoc 0.20 ou mais novo). As cores têm papéis e o
  # nome do material de onde vêm (CULTURA.md).
  templates: v2
  pack: bororo
  palette:
    ground: {color: "#F4F1EA", material: "argila branca, penugem branca"}
    ink: {color: "#111827", material: "carvão e resina"}
    primary: {color: "#C81F2D", material: "urucum"}
    fill: {color: "#D4A03A", material: "pena amarela"}
    muted: {color: "#6B6F5A"}
  hero_people: true
  hero_credit: ""
  hero_alt: "Moça com um papagaio pousado no braço, em meio à mata"
  favicon: "images/logo.svg"
  hero_image: "images/fauna_full.jpg"

# O alfabeto do dicionário (letras e ordem), proposto em 2026-11-18 a partir de fontes
# publicadas; veja CULTURA.md. As vogais acentuadas ficam junto da vogal simples.
alphabet: [a, b, c, d, e, g, i, j, k, m, n, o, p, r, t, u, w]
